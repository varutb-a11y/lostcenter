<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ศูนย์รวมแจ้งของหาย-เก็บได้ (Lost & Found)</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-blue: #0066cc;
            --light-blue: #e6f2ff;
            --white: #ffffff;
            --text-dark: #333333;
            --text-grey: #666666;
            --accent-red: #ff4d4d;
            --accent-green: #00cc66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f4f8fb;
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Header */
        header {
            background-color: var(--primary-blue);
            color: var(--white);
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* Container */
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Form Section */
        .form-card {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            border-top: 5px solid var(--primary-blue);
        }

        .form-title {
            margin-bottom: 15px;
            color: var(--primary-blue);
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Kanit', sans-serif;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .radio-option input {
            width: auto;
            margin-right: 8px;
        }

        button.submit-btn {
            background-color: var(--primary-blue);
            color: var(--white);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.3s;
        }

        button.submit-btn:hover {
            background-color: #0052a3;
        }

        /* Filter Section */
        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 20px;
            border: 1px solid var(--primary-blue);
            background: transparent;
            color: var(--primary-blue);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary-blue);
            color: var(--white);
        }

        /* Item List */
        .item-list {
            display: grid;
            gap: 20px;
        }

        .item-card {
            background: var(--white);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            position: relative;
            border-left: 5px solid #ddd;
        }

        .item-card.lost { border-left-color: var(--accent-red); }
        .item-card.found { border-left-color: var(--accent-green); }

        .badge {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
        }

        .badge.lost { background-color: var(--accent-red); }
        .badge.found { background-color: var(--accent-green); }

        .item-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .item-desc {
            color: var(--text-grey);
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .item-meta {
            font-size: 0.85rem;
            color: #888;
            margin-top: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .item-meta i {
            margin-right: 5px;
            color: var(--primary-blue);
        }

        .delete-btn {
            margin-top: 15px;
            background: #ffebee;
            color: var(--accent-red);
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            align-self: flex-start;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container { padding: 0 10px; }
            .item-meta { flex-direction: column; gap: 5px; }
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fas fa-search-location"></i> ศูนย์ของหาย-เก็บได้</h1>
        <p>Community Lost & Found Center</p>
    </header>

    <div class="container">
        <div class="form-card">
            <h3 class="form-title"><i class="fas fa-edit"></i> แจ้งข้อมูลใหม่</h3>
            <form id="reportForm">
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="type" value="lost" checked>
                        <span style="color: var(--accent-red); font-weight: bold;">แจ้งของหาย (Lost)</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="type" value="found">
                        <span style="color: var(--accent-green); font-weight: bold;">แจ้งเก็บได้ (Found)</span>
                    </label>
                </div>

                <div class="form-group">
                    <label>ชื่อสิ่งของ *</label>
                    <input type="text" id="itemName" placeholder="เช่น กระเป๋าสตางค์สีดำ, กุญแจรถ..." required>
                </div>

                <div class="form-group">
                    <label>รายละเอียดเพิ่มเติม</label>
                    <textarea id="itemDesc" rows="3" placeholder="ระบุลักษณะเด่น ยี่ห้อ หรือตำหนิ..."></textarea>
                </div>

                <div class="form-group">
                    <label>สถานที่ (หาย/เก็บได้) *</label>
                    <input type="text" id="itemLocation" placeholder="เช่น โรงอาหาร, หน้าตึก A..." required>
                </div>

                <div class="form-group">
                    <label>ช่องทางติดต่อกลับ (เบอร์โทร/Line) *</label>
                    <input type="text" id="contactInfo" placeholder="เช่น 081-xxx-xxxx" required>
                </div>

                <button type="submit" class="submit-btn">บันทึกข้อมูล</button>
            </form>
        </div>

        <hr style="border: 0; border-top: 1px solid #ddd; margin: 30px 0;">

        <div class="filters">
            <button class="filter-btn active" onclick="filterItems('all')">ทั้งหมด</button>
            <button class="filter-btn" onclick="filterItems('lost')">ของหาย</button>
            <button class="filter-btn" onclick="filterItems('found')">เก็บได้</button>
        </div>

        <div id="itemList" class="item-list">
            </div>
    </div>

    <script>
        // การทำงานของ JavaScript

        // 1. โหลดข้อมูลเมื่อเปิดหน้าเว็บ
        document.addEventListener('DOMContentLoaded', () => {
            loadItems();
        });

        const form = document.getElementById('reportForm');
        
        // 2. ฟังก์ชันเมื่อกดปุ่มบันทึก
        form.addEventListener('submit', (e) => {
            e.preventDefault(); // ป้องกันเว็บรีเฟรช

            // รับค่าจากฟอร์ม
            const type = document.querySelector('input[name="type"]:checked').value;
            const name = document.getElementById('itemName').value;
            const desc = document.getElementById('itemDesc').value;
            const location = document.getElementById('itemLocation').value;
            const contact = document.getElementById('contactInfo').value;
            const date = new Date().toLocaleString('th-TH');
            const id = Date.now(); // สร้าง ID จากเวลาปัจจุบัน

            // สร้าง Object ข้อมูล
            const newItem = { id, type, name, desc, location, contact, date };

            // บันทึกลง LocalStorage
            saveItem(newItem);

            // เคลียร์ฟอร์มและโหลดรายการใหม่
            form.reset();
            loadItems();
            alert('บันทึกข้อมูลเรียบร้อยแล้ว!');
        });

        // ฟังก์ชันบันทึกข้อมูลลง Browser
        function saveItem(item) {
            let items = JSON.parse(localStorage.getItem('lostFoundItems')) || [];
            items.unshift(item); // เพิ่มรายการใหม่ไว้บนสุด
            localStorage.setItem('lostFoundItems', JSON.stringify(items));
        }

        // ฟังก์ชันโหลดและแสดงผลข้อมูล
        function loadItems(filterType = 'all') {
            const listContainer = document.getElementById('itemList');
            const items = JSON.parse(localStorage.getItem('lostFoundItems')) || [];
            
            listContainer.innerHTML = ''; // เคลียร์หน้าจอก่อนวาดใหม่

            if (items.length === 0) {
                listContainer.innerHTML = '<div class="empty-state"><i class="fas fa-box-open fa-3x"></i><br><br>ยังไม่มีรายการแจ้งเข้ามา</div>';
                return;
            }

            items.forEach(item => {
                // กรองข้อมูลตามปุ่มที่กด
                if (filterType !== 'all' && item.type !== filterType) return;

                const card = document.createElement('div');
                card.className = `item-card ${item.type}`;
                
                const badgeText = item.type === 'lost' ? 'ตามหา' : 'เก็บได้';
                const badgeClass = item.type;

                card.innerHTML = `
                    <span class="badge ${badgeClass}">${badgeText}</span>
                    <div class="item-title">${item.name}</div>
                    <div class="item-desc">${item.desc || '-'}</div>
                    <div class="item-meta">
                        <span><i class="fas fa-map-marker-alt"></i> ${item.location}</span>
                        <span><i class="fas fa-clock"></i> ${item.date}</span>
                        <span><i class="fas fa-phone"></i> ${item.contact}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteItem(${item.id})">ลบรายการ</button>
                `;
                
                listContainer.appendChild(card);
            });
        }

        // ฟังก์ชันลบรายการ
        function deleteItem(id) {
            if(confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) {
                let items = JSON.parse(localStorage.getItem('lostFoundItems')) || [];
                items = items.filter(item => item.id !== id);
                localStorage.setItem('lostFoundItems', JSON.stringify(items));
                loadItems();
            }
        }

        // ฟังก์ชันกรอง (Filter)
        function filterItems(type) {
            // ปรับสีปุ่ม Active
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            loadItems(type);
        }
    </script>
</body>
</html>
